[project]
name = "pixeltable-violin-playtest-audio"
version = "0.1.0"
description = "Split violin play-test recordings into silence-aware chunks, transcribe luthier voice notes with WhisperX, and evolve the schema safely - built with Pixeltable"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Pierre Brunelle" }]
keywords = ["pixeltable", "multimodal", "ai", "computed-columns", "data-infrastructure", "violin-playtest-audio"]
dependencies = [
    "pixeltable>=0.7.24",
    "av",
    "numpy",
    "openai",
    "whisperx",
]

[project.urls]
Homepage = "https://pixeltable.com"
Documentation = "https://docs.pixeltable.com"
Pixeltable = "https://github.com/pixeltable/pixeltable"
